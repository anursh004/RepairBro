server:
  port: 8084

spring:
  application:
    name: diag-flow

  datasource:
    url: jdbc:postgresql://localhost:5432/diag_db
    username: repairbro
    password: repairbro_dev

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "domainEvent:com.repairbro.commons.event.DomainEvent"

  data:
    redis:
      host: localhost
      port: 6379

# ── JWT Config (shared secret for token validation) ───
repairbro:
  jwt:
    secret: RepairBroSuperSecretKeyForDevelopmentOnlyChangeInProduction2024!

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
