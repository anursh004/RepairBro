server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: repairbro
    password: repairbro_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "domainEvent:com.repairbro.commons.event.DomainEvent"

  # ── Email (SMTP) Config ───────────────────────────────
  # Default: Gmail SMTP — replace with your SMTP provider
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

# ── App-specific config ─────────────────────────────────
repairbro:
  notification:
    from-email: ${NOTIFICATION_FROM:noreply@repairbro.in}
    from-name: RepairBro
    sms-enabled: false   # Set true when SMS provider configured
    email-enabled: true
    # SMS provider: twilio or msg91
    sms-provider: msg91
    sms-api-key: ${SMS_API_KEY:}
  # ── JWT Config (shared secret for token validation) ───
  jwt:
    secret: RepairBroSuperSecretKeyForDevelopmentOnlyChangeInProduction2024!

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
