server:
  port: 8088
spring:
  application:
    name: sla-guard
  datasource:
    url: jdbc:postgresql://localhost:5432/sla_db
    username: repairbro
    password: repairbro_dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "domainEvent:com.repairbro.commons.event.DomainEvent"
# ── JWT Config (shared secret for token validation) ───
repairbro:
  jwt:
    secret: RepairBroSuperSecretKeyForDevelopmentOnlyChangeInProduction2024!

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
