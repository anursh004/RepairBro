server:
  port: 8083

spring:
  application:
    name: fix-bill

  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: repairbro
    password: repairbro_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "domainEvent:com.repairbro.commons.event.DomainEvent"
    consumer:
      group-id: fix-bill-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.repairbro.commons.event"
        spring.json.type.mapping: "domainEvent:com.repairbro.commons.event.DomainEvent"

# ── Actuator ───────────────────────────────────────────
# ── JWT Config (shared secret for token validation) ───
repairbro:
  jwt:
    secret: RepairBroSuperSecretKeyForDevelopmentOnlyChangeInProduction2024!

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
