# ─────────────────────────────────────────────────────────
# RepairBro Platform — Local Development Infrastructure
# Run: docker-compose up -d
# ─────────────────────────────────────────────────────────
version: '3.9'

services:
  # ── PostgreSQL (separate databases per service) ──────
  postgres:
    image: postgres:16-alpine
    container_name: repairbro-postgres
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: repairbro
      POSTGRES_PASSWORD: repairbro_dev
      POSTGRES_MULTIPLE_DATABASES: auth_db,repair_db,billing_db,diag_db,parts_db,franchise_db,sla_db,analytics_db,sim_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U repairbro" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Kafka ─────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: repairbro-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Kafka UI (management) ────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: repairbro-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: repairbro-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "9090:8080"

  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: repairbro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kong API Gateway ─────────────────────────────────
  kong:
    image: kong:3.7-alpine
    container_name: repairbro-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    ports:
      - "8000:8000" # API proxy
      - "8001:8001" # Admin API
    volumes:
      - ./api-gateway/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - postgres

volumes:
  postgres_data:
  kafka_data:
  redis_data:
